<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>遠端畫面 - Smart Hunter</title>
<!--
  Smart Hunter 遠端看畫面的觀看頁 (放在 sd016808/Lost-Ark-Smart-Hunter 的 GitHub Pages：remote/index.html)
  協定跟 Infrastructure/RemoteView.cs 對應，改了兩邊要一起改；舊版 exe 也會連這一頁，要保持相容
-->
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e8eaf0; --muted:#8b93a7;
    --accent:#3d8bfd; --accent-fg:#fff; --ok:#2fbf71; --warn:#f0b429; --bad:#ef5350;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f5f9; --panel:#fff; --line:#dde2ea; --fg:#1b1f27; --muted:#667085; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  button, select, input { font:inherit; color:inherit; }
  .hidden { display:none !important; }

  /* ===== 連線畫面 ===== */
  #login { min-height:100%; display:grid; place-items:center; padding:24px 16px; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
          border-radius:14px; padding:28px 24px; box-shadow:0 12px 32px rgba(0,0,0,.18); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .brand svg { flex:none; color:var(--accent); }
  .card h1 { margin:0; font-size:20px; }
  .sub { margin:0 0 18px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  .field { position:relative; }
  input { width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:8px;
          text-transform:uppercase; letter-spacing:.06em; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(61,139,253,.25); }
  .field input { padding-right:56px; }
  .eye { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:0;
         color:var(--muted); padding:6px 8px; cursor:pointer; font-size:13px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:7px 12px;
         border-radius:8px; border:1px solid var(--line); background:var(--bg); cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:var(--muted); }
  .btn.primary { width:100%; margin-top:22px; padding:11px; font-weight:600;
                 background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  .btn.danger { color:var(--bad); border-color:rgba(239,83,80,.45); }
  .btn:disabled { opacity:.6; cursor:default; }
  #loginMsg { min-height:1.5em; margin:12px 0 0; font-size:13px; color:var(--muted); text-align:center; }
  #loginMsg.bad { color:var(--bad); }
  .hint { margin:18px 0 0; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }

  /* ===== 觀看畫面 ===== */
  #viewer { height:100%; display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 16px;
         background:var(--panel); border-bottom:1px solid var(--line); }
  .state { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.ok { background:var(--ok); box-shadow:0 0 0 3px rgba(47,191,113,.22); }
  .dot.warn { background:var(--warn); }
  #stateText { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stats { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  /* 手機：第一行狀態 + 流量，第二行按鈕 */
  @media (max-width:640px) {
    .bar { padding:8px 12px; }
    .controls { flex:1 1 100%; }
    .controls > * { flex:1 1 auto; }
  }
  .bar select { padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); }
  #stage { flex:1; min-height:0; overflow:auto; display:flex; background:#000; position:relative; }
  #screen { display:block; margin:auto; }
  /* 顯示方式：填滿寬度 (太高就捲動) / 整個畫面 (縮到看得到全部) / 原始大小 (1280 寬，跟著瀏覽器縮放、手機可以兩指放大) */
  #screen.width { width:100%; height:auto; }
  #screen.fit { width:100%; height:100%; object-fit:contain; }
  #overlay { position:absolute; inset:0; display:grid; place-items:center; padding:16px; text-align:center;
             color:#fff; background:rgba(0,0,0,.5); font-size:14px; }
</style>
</head>
<body>

<main id="login">
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <h1>遠端畫面</h1>
    </div>
    <p class="sub">Smart Hunter · 只能看、不能操作</p>
    <label for="room">房間碼</label>
    <input id="room" autocapitalize="characters" spellcheck="false" required>
    <label for="pass">密碼</label>
    <div class="field">
      <input id="pass" type="password" autocapitalize="characters" spellcheck="false" required>
      <button type="button" class="eye" id="eye">顯示</button>
    </div>
    <button class="btn primary" id="go" type="submit">連線</button>
    <p id="loginMsg" role="status"></p>
    <p class="hint">在 Smart Hunter 的 settings.json 開啟 remoteView 後，程式視窗會顯示房間碼。畫面由兩台裝置直接連線傳送，不經過伺服器。網址後面加上「#房間碼/密碼」並加入書籤，下次打開就會自動連線。</p>
  </form>
</main>

<div id="viewer" class="hidden">
  <div class="bar">
    <div class="state"><span class="dot" id="dot"></span><span id="stateText"></span></div>
    <span id="stats"></span>
    <div class="controls">
      <select id="screens" class="hidden" aria-label="螢幕"></select>
      <select id="fit" aria-label="顯示方式">
        <option value="width">填滿寬度</option>
        <option value="fit">整個畫面</option>
        <option value="real">原始大小</option>
      </select>
      <button class="btn" id="full" type="button">全螢幕</button>
      <button class="btn danger" id="disconnect" type="button">中斷連線</button>
    </div>
  </div>
  <div id="stage">
    <img id="screen" alt="">
    <div id="overlay" class="hidden"></div>
  </div>
</div>

<script>
const NTFY = "https://ntfy.sh";
const STUN = ["stun:stun.l.google.com:19302", "stun:stun.cloudflare.com:3478"];
const TRIES = 3;          // 連不上自動重試幾次 (手機網路打洞時好時壞，重新來過常常就通)
const NO_ANSWER_MS = 15000;
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();

// ===== 加密：跟分享端相同，deflate-raw 壓縮 → AES-GCM → base64(iv | 密文 | tag) =====
async function sha256(s) { return new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(s))); }
const hex = b => [...b].map(x => x.toString(16).padStart(2, "0")).join("");
const b64 = b => btoa(String.fromCharCode(...b));
const unb64 = s => Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0));
async function pipe(bytes, stream) {
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
}
async function encrypt(key, obj) {
  const plain = await pipe(enc.encode(JSON.stringify(obj)), new CompressionStream("deflate-raw"));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plain));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  return b64(all);
}
async function decrypt(key, text) {
  const all = unb64(text);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(0, 12) }, key, all.slice(12));
  return JSON.parse(dec.decode(await pipe(new Uint8Array(plain), new DecompressionStream("deflate-raw"))));
}

// ===== 畫面切換 =====
let pc = null, es = null, everConnected = false, wakeLock = null;
let frameCount = 0, tickFrames = 0, tickBytes = 0, lastFrameAt = 0;

function closePeer() { const p = pc, e = es; pc = es = null; if (p) p.close(); if (e) e.close(); }
function loginMsg(text, bad) { $("loginMsg").textContent = text || ""; $("loginMsg").className = bad ? "bad" : ""; }
function showLogin(text, bad) {
  closePeer();
  everConnected = false;
  releaseWake();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  $("viewer").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("go").disabled = false;
  $("go").textContent = "連線";
  loginMsg(text, bad);
  document.title = "遠端畫面 - Smart Hunter";
}
function showViewer() { $("login").classList.add("hidden"); $("viewer").classList.remove("hidden"); }
function setState(kind, text) { $("dot").className = "dot " + kind; $("stateText").textContent = text; }
function overlay(text) { $("overlay").textContent = text || ""; $("overlay").classList.toggle("hidden", !text); }
// 連線進度：第一次連線顯示在卡片上；看畫面時斷線重連顯示在畫面上
function progress(text) { if (everConnected) { setState("warn", text); overlay(text); } else loginMsg(text); }
const fail = text => showLogin(text, true);

// 連線中不讓手機自動鎖屏 (鎖屏後瀏覽器會暫停，連線就斷了)
async function requestWake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.onrelease = () => { wakeLock = null; }; } } catch {}
}
function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && pc && pc.connectionState === "connected") requestWake();
});

// ===== 連線 =====
async function connect(room, pass, attempt = 1) {
  closePeer();
  const tag = attempt > 1 ? `（重試 ${attempt - 1}/${TRIES - 1}）` : "";
  const topic = "lash-" + hex(await sha256("lash-topic:" + room)).slice(0, 24);
  const key = await crypto.subtle.importKey("raw", await sha256("lash-key:" + room + ":" + pass), "AES-GCM", false, ["encrypt", "decrypt"]);
  const id = hex(crypto.getRandomValues(new Uint8Array(6)));

  const me = pc = new RTCPeerConnection({ iceServers: [{ urls: STUN }] });
  const cands = { host: 0, srflx: 0 };
  let connected = false;
  me.onicecandidate = e => { if (e.candidate && e.candidate.type in cands) cands[e.candidate.type]++; };
  me.onconnectionstatechange = () => {
    if (pc !== me) return;   // 已經中斷或重連，舊的不管
    const st = me.connectionState;
    if (st === "connected") {
      connected = everConnected = true;
      showViewer();
      setState("ok", "已連線");
      if (!lastFrameAt) overlay("等待畫面…");
      requestWake();
    } else if (st === "disconnected") {
      setState("warn", "訊號不穩，等待恢復…");
    } else if (st === "failed") {
      // 連過又斷 (例如手機從 Wi-Fi 換到 4G) 從頭重連；沒連上過就重試到 TRIES 次
      if (connected) { progress("連線中斷，重新連線…"); run(room, pass, 1); }
      else if (attempt < TRIES) { progress("連不上，自動重試…"); run(room, pass, attempt + 1); }
      else fail(cands.srflx ? "連不上：雙方網路不允許直接連線，換個網路再試（例如 Wi-Fi 與行動網路互換）"
                            : "連不上：這台裝置查不到自己的外網位址，換個網路再試");
    }
  };

  const dc = me.createDataChannel("screen");
  dc.binaryType = "arraybuffer";
  let frames = new Map(), shown = -1, url = null;
  dc.onmessage = e => {
    if (typeof e.data === "string") { showScreens(dc, JSON.parse(e.data)); return; }
    tickBytes += e.data.byteLength;
    // 一張畫面切成好幾塊：標頭 = 畫面編號 u32、第幾塊 u16、共幾塊 u16 (little endian)
    const v = new DataView(e.data);
    const f = v.getUint32(0, true), i = v.getUint16(4, true), n = v.getUint16(6, true);
    if (f <= shown) return;
    let parts = frames.get(f);
    if (!parts) { parts = { n, got: 0, data: new Array(n) }; frames.set(f, parts); }
    if (!parts.data[i]) { parts.data[i] = new Uint8Array(e.data, 8); parts.got++; }
    if (parts.got < parts.n) return;
    for (const k of frames.keys()) if (k <= f) frames.delete(k);
    shown = f;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(new Blob(parts.data, { type: "image/jpeg" }));
    $("screen").src = url;
    frameCount++; tickFrames++; lastFrameAt = Date.now();
    if (!$("overlay").classList.contains("hidden") && me.connectionState === "connected") overlay("");
    document.title = `遠端畫面 (${frameCount}) - Smart Hunter`;
  };

  progress("查詢網路位址…" + tag);
  await me.setLocalDescription(await me.createOffer());
  // 等網路位址收集完再送出。手機網路查外網位址 (srflx) 可能要好幾秒，沒等到就送出一定打不通：
  // 收集完成就送；查到外網位址後最多再等 1.5 秒 (等另一台 STUN)；最多等 10 秒
  await new Promise(r => {
    const t0 = Date.now();
    let srflxAt = 0;
    const timer = setInterval(() => {
      if (cands.srflx && !srflxAt) srflxAt = Date.now();
      if (pc !== me || me.iceGatheringState === "complete" || (srflxAt && Date.now() - srflxAt > 1500) || Date.now() - t0 > 10000) { clearInterval(timer); r(); }
    }, 100);
  });
  if (pc !== me) return;

  progress("等待分享端回應…" + tag);
  const myEs = es = new EventSource(`${NTFY}/${topic}/sse`);
  const opened = new Promise(r => { myEs.onopen = r; });
  myEs.onmessage = async e => {
    const m = JSON.parse(e.data);
    if (m.event !== "message") return;
    let msg;
    try { msg = await decrypt(key, m.message); } catch { return; }   // 密碼不同 / 其他人的訊息
    if (msg.t !== "answer" || msg.id !== id) return;
    myEs.close();
    if (pc !== me) return;
    progress("連線中…" + tag);
    await me.setRemoteDescription({ type: "answer", sdp: msg.sdp });
  };
  await opened;
  if (pc !== me) return;
  const body = await encrypt(key, { t: "offer", id, sdp: me.localDescription.sdp });
  await fetch(`${NTFY}/${topic}`, { method: "POST", body });
  setTimeout(() => {
    if (pc === me && me.connectionState === "new") fail("分享端沒有回應：程式沒有開，或房間碼 / 密碼不對");
  }, NO_ANSWER_MS);
}
const run = (room, pass, attempt) => connect(room, pass, attempt).catch(e => { if (pc) fail("錯誤：" + e.message); });

function start() {
  const room = $("room").value.trim().toUpperCase(), pass = $("pass").value.trim().toUpperCase();
  if (!room || !pass) { loginMsg("請輸入房間碼與密碼", true); return; }
  try { localStorage.setItem("lash-room", room); } catch {}
  $("go").disabled = true;
  $("go").textContent = "連線中…";
  everConnected = false; frameCount = 0; lastFrameAt = 0;
  $("screen").removeAttribute("src");
  run(room, pass, 1);
}

// 每秒更新：張數 / 流量；太久沒有新畫面要提醒
setInterval(() => {
  if (!pc || pc.connectionState !== "connected") { tickFrames = tickBytes = 0; return; }
  $("stats").textContent = `${tickFrames} 張/秒 · ${Math.round(tickBytes / 1024)} KB/s`;
  tickFrames = tickBytes = 0;
  const idle = lastFrameAt ? Math.floor((Date.now() - lastFrameAt) / 1000) : 0;
  if (idle >= 5) setState("warn", `已連線，${idle} 秒沒有新畫面`);
  else if (lastFrameAt) setState("ok", "已連線");
}, 1000);

// 分享端傳來螢幕清單 → 下拉選單；選了就請分享端換螢幕 (記住上次選的)
function showScreens(dc, m) {
  if (m.t !== "screens") return;
  const sel = $("screens");
  sel.innerHTML = "";
  for (const s of m.list) sel.add(new Option(`螢幕 ${s.i + 1}${s.primary ? "（主）" : ""}`, s.i));
  let want = null;
  try { want = localStorage.getItem("lash-screen"); } catch {}
  const pick = m.list.find(s => String(s.i) === want) || m.list.find(s => s.primary) || m.list[0];
  sel.value = pick.i;
  sel.classList.toggle("hidden", m.list.length < 2);
  const choose = () => {
    try { localStorage.setItem("lash-screen", sel.value); } catch {}
    if (dc.readyState === "open") dc.send(JSON.stringify({ t: "screen", i: Number(sel.value) }));
  };
  sel.onchange = choose;
  choose();
}

// ===== 按鈕 =====
$("form").onsubmit = e => { e.preventDefault(); start(); };
$("eye").onclick = () => {
  const p = $("pass");
  p.type = p.type === "password" ? "text" : "password";
  $("eye").textContent = p.type === "password" ? "顯示" : "隱藏";
};
$("disconnect").onclick = () => showLogin("已中斷連線");
if (document.fullscreenEnabled) {
  $("full").onclick = () => document.fullscreenElement ? document.exitFullscreen().catch(() => {}) : $("stage").requestFullscreen().catch(() => {});
  document.addEventListener("fullscreenchange", () => { $("full").textContent = document.fullscreenElement ? "結束全螢幕" : "全螢幕"; });
} else $("full").classList.add("hidden");   // iPhone 的 Safari 不支援

const fit = $("fit");
try { fit.value = localStorage.getItem("lash-fit") || "width"; } catch {}
const applyFit = () => { $("screen").className = fit.value; try { localStorage.setItem("lash-fit", fit.value); } catch {} };
fit.onchange = applyFit;
applyFit();

try { $("room").value = localStorage.getItem("lash-room") || ""; } catch {}
// 網址可帶 #房間碼/密碼 直接連線 (方便加入書籤)
const h = decodeURIComponent(location.hash.slice(1)).split("/");
if (h.length === 2 && h[0] && h[1]) { $("room").value = h[0]; $("pass").value = h[1]; start(); }
</script>
</body>
</html>
